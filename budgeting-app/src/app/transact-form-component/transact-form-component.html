
<div class="page">
  <button (click)="getCategories()">Click Me</button>
    <div class="form-container">
      <form #userForm="ngForm" (ngSubmit)="onSubmit()" novalidate>
          <label for="category">Category</label>
          <input type="text" id="category" name="category" [(ngModel)]=transact.category required class="form-control">

          <label for="cost">Cost</label>
          <input type="number" id="cost" name="cost" [(ngModel)]=transact.cost required class="form-control">

          <label for="date">date</label>
          <input type="text" id="date" name="date" [(ngModel)]=transact.date required class="form-control">

          <label for="note">Note</label>
          <input type="text" id="note" name="note" [(ngModel)]=transact.note required class="form-control">

          <!--<button type="submit" [disabled]="userForm.invalid">Register</button>-->
          <button type="submit">Register</button>
      </form>
