
<div class="page">
  
  <div class="container form-container">
    <form #userForm="ngForm" (ngSubmit)="onSubmit()" novalidate>
      <button (click)="getCategories()">Click Me</button>
      <div class="row justify-content-center">
        <input type="text" inputmode="decimal" class="form-control cost-input text-center" id="cost" name="cost" [(ngModel)]="transact.cost" required>
      </div> 

      <div class="row">
        <label for="category">Category</label>
        <input type="text" id="category" name="category" [(ngModel)]="transact.category" required class="form-control">
      </div>

      <div class="row">
        <label for="date">Date</label>
        <input type="text" id="date" name="date" [(ngModel)]="transact.date" class="form-control">
      </div>

      <div class="row">
        <label for="note">Note</label>
        <input type="text" id="note" name="note" [(ngModel)]="transact.note" class="form-control">
      </div>

      <div class="row">
        <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">Submit Transaction</button>
      </div>
    </form>
  </div>
</div>
